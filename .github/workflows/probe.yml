name: probe
on:
  push:
  workflow_dispatch:
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: uname -a
  mac_latest:
    runs-on: macos-latest
    steps:
      - run: sw_vers && uname -m
  mac_14:
    runs-on: macos-14
    steps:
      - run: sw_vers
  mac_15:
    runs-on: macos-15
    steps:
      - run: sw_vers