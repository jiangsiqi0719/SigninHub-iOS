name: build-ipa

on:
  push:
    branches: [main, ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. CPython 3.11 for iOS（BeeWare 预编译 xcframework，含 _ssl /
      #    _sqlite3 / _hashlib / _ctypes / zlib，纯标准库后端直接可跑）
      # ---------------------------------------------------------------
      - name: Cache Python.xcframework
        id: pycache
        uses: actions/cache@v4
        with:
          path: ios/Python.xcframework
          key: python-ios-3.11-b13

      - name: Fetch Python.xcframework
        if: steps.pycache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/py.tar.gz \
            "https://github.com/beeware/Python-Apple-support/releases/download/3.11-b13/Python-3.11-iOS-support.b13.tar.gz"
          rm -rf /tmp/pyext && mkdir -p /tmp/pyext
          tar -xzf /tmp/py.tar.gz -C /tmp/pyext Python.xcframework
          mkdir -p ios
          rm -rf ios/Python.xcframework
          mv /tmp/pyext/Python.xcframework ios/Python.xcframework
          du -sh ios/Python.xcframework
          ls ios/Python.xcframework

      # ---------------------------------------------------------------
      # 2. 后端源码 -> ios/backend，并打 iOS 兼容补丁（ctypes.wintypes）
      # ---------------------------------------------------------------
      - name: Prepare backend
        run: python3 ios/scripts/prepare_backend.py

      # ---------------------------------------------------------------
      # 3. 用后端自带的 icon-512.png 生成 AppIcon 全套尺寸
      # ---------------------------------------------------------------
      - name: Generate app icons
        run: |
          set -euo pipefail
          SRC="backend/web/static/icon-512.png"
          OUT="ios/Resources/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$SRC" ]; then
            echo "::warning::找不到 $SRC，跳过图标生成（App 会显示默认空白图标）"
            exit 0
          fi
          while IFS=: read -r size name; do
            /usr/bin/sips -z "$size" "$size" "$SRC" --out "$OUT/$name.png" >/dev/null
          done <<'SPECS'
          40:AppIcon-20@2x
          60:AppIcon-20@3x
          58:AppIcon-29@2x
          87:AppIcon-29@3x
          80:AppIcon-40@2x
          120:AppIcon-40@3x
          120:AppIcon-60@2x
          180:AppIcon-60@3x
          1024:AppIcon-1024
          SPECS
          ls -l "$OUT"

      # ---------------------------------------------------------------
      # 4. 生成 Xcode 工程并编译（arm64 真机，不签名）
      # ---------------------------------------------------------------
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          echo "--- 生成的 scheme / target ---"
          xcodebuild -project SigninHub.xcodeproj -list

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SigninHub.xcodeproj \
            -scheme SigninHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # ---------------------------------------------------------------
      # 5. 打包成 IPA（Payload/SigninHub.app）
      # ---------------------------------------------------------------
      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then echo "::error::没找到 .app"; exit 1; fi
          echo "APP=$APP"
          echo "--- 结构自检 ---"
          test -d "$APP/python/lib/python3.11" || { echo "::error::stdlib 没进包"; exit 1; }
          test -d "$APP/Frameworks/Python.framework" || { echo "::error::Python.framework 没进包"; exit 1; }
          test -d "$APP/backend/signbot" || { echo "::error::backend 没进包"; exit 1; }
          ls "$APP/Frameworks" | head -20
          echo "framework 数量: $(ls -1 "$APP/Frameworks" | wc -l)"

          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SigninHub.ipa Payload
          rm -rf Payload
          ls -lh SigninHub.ipa
          shasum -a 256 SigninHub.ipa | tee SigninHub.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SigninHub-ipa
          path: |
            ios/SigninHub.ipa
            ios/SigninHub.ipa.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore

      # 构建失败时把日志挂到 Release —— CI 的 job log 接口会 302 到
      # pipelines.actions.githubusercontent.com，那边在墙内不一定通；
      # 而 Release 资产可以走 ghfast.top 镜像直接拉。
      - name: Publish failure log to release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-fail-${{ github.run_number }}
          name: "build failed #${{ github.run_number }}"
          body: |
            构建失败，附完整 build.log。
            运行页: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            ios/build.log
          draft: false

      # ---------------------------------------------------------------
      # 6. 发到 Release，方便直接下载（也方便走 ghfast 镜像加速）
      # ---------------------------------------------------------------
      - name: Publish release
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v2.62.${{ github.run_number }}
          name: SigninHub iOS v2.62 (build ${{ github.run_number }})
          body: |
            未签名 IPA（arm64），TrollStore / 巨魔 直接安装。

            内含 CPython 3.11 + 原项目 backend，网页界面与安卓 APK 完全一致。
          files: |
            ios/SigninHub.ipa
            ios/SigninHub.ipa.sha256
          draft: false
