name: SigninHub
options:
  bundleIdPrefix: com.signhub
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"

targets:
  SigninHub:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
      - path: backend
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: SigninHub
        PRODUCT_BUNDLE_IDENTIFIER: com.signhub.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64
        VALID_ARCHS: arm64
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS:
          - "-ObjC"
          # 显式写死 rpath。首版只靠 LD_RUNPATH_SEARCH_PATHS 没生效，
          # 产物里一个 LC_RPATH 都没有 → dyld 解析不了
          # @rpath/Python.framework/Python，App 启动即崩。
          - "-rpath"
          - "@executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Python.xcframework/ios-arm64/Python.framework/Headers"
          - "$(SRCROOT)/Python.xcframework/ios-arm64/include/python3.11"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
    postCompileScripts:
      - name: "Install Python stdlib (linux-safe, ad-hoc sign)"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="-"
          export EXPANDED_CODE_SIGN_IDENTITY_NAME="ad-hoc"
          source "$SRCROOT/scripts/bp_utils.sh"
          install_python "Python.xcframework"
          echo "python stdlib installed into $CODESIGNING_FOLDER_PATH/python"
